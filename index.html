<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Education Launch Sequence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling */
        body {
            margin: 0;
            background-color: #010408; 
            color: #0f0;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* --- HIDDEN UTILITY BUTTONS --- */
        #fullscreen-btn, #refresh-btn {
            position: fixed;
            bottom: 15px;
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 255, 0, 0.2);
            color: rgba(0, 255, 0, 0.3);
            width: 40px;
            height: 40px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10000; 
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        #fullscreen-btn:hover, #fullscreen-btn:active,
        #refresh-btn:hover, #refresh-btn:active {
            background: rgba(0, 255, 0, 0.2);
            border-color: #0f0;
            color: #0f0;
        }
        #fullscreen-btn { right: 15px; }
        #refresh-btn { left: 15px; }

        /* --- 1: THE ROBOT SHELL OVERLAY --- */
        .robot-shell-overlay {
            position: fixed;
            top: 50%; left: 50%; 
            width: 100vw; height: 100vh;
            transform: translate(-50%, -50%) scale(1.3);
            object-fit: fill; 
            pointer-events: none; 
            z-index: 9999;
            mix-blend-mode: screen; 
        }

        /* --- 2: UTHM LOGO FACE BACKGROUND --- */
        .bg-watermark {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 550px; 
            height: auto;
            opacity: 0.15; 
            pointer-events: none;
            z-index: 1;
            filter: grayscale(100%) sepia(100%) hue-rotate(90deg) brightness(150%);
        }

        /* --- SCREEN CONTROLLER --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            text-align: center;
            position: absolute;
            top: 0; left: 0;
            padding: 80px; 
            box-sizing: border-box;
            z-index: 10;
        }
        .screen.active { display: flex; }

        /* --- SCREEN 1: GREEN TURBINE EYES --- */
        .eyes-container {
            display: flex;
            gap: 160px; 
            margin-bottom: 120px; 
        }
        
        .eye {
            width: 260px; 
            height: 260px; 
            border-radius: 50%;
            background-color: #001100;
            box-shadow: 0 0 70px #0f0, inset 0 0 60px #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: eye-behavior 10s infinite;
        }

        .eye::before {
            content: '';
            position: absolute;
            width: 85%; height: 85%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, #0f0 0deg 5deg, #004400 6deg 10deg);
            -webkit-mask-image: radial-gradient(circle, transparent 25%, black 26%, black 90%, transparent 100%);
            animation: spin 20s linear infinite; 
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 35%; height: 35%;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #0f0 40%, transparent 70%);
            box-shadow: 0 0 35px #fff;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @keyframes eye-behavior {
            0%, 10% { transform: translate(0, 0) scale(1); }
            12%, 14% { transform: translate(0, 0) scaleY(0.1) scaleX(1.1); } 
            16%, 30% { transform: translate(0, 0) scale(1); }
            35%, 45% { transform: translate(-55px, 0) scale(1); }
            50%, 60% { transform: translate(55px, 0) scale(1); }
            65%, 70% { transform: translate(0, 0) scale(1); }
            75%, 85% { transform: translate(0, -15px) scaleY(0.8) scaleX(1.1); }
            90% { transform: translate(0, 0) scale(1); }
            95%, 97% { transform: translate(0, 0) scaleY(0.1) scaleX(1.1); } 
            100% { transform: translate(0, 0) scale(1); }
        }
        
        #initiate-btn {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            color: #0f0;
            padding: 25px 50px; 
            font-size: 28px;    
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            transition: all 0.2s ease;
            z-index: 10;
            margin-top: 40px;
        }
        #initiate-btn:active {
            background: #0f0;
            color: #000;
            transform: scale(0.95);
        }

        /* --- SCREEN 2: HUD BLUEPRINT SCANNER --- */
        #screen-scan {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
        }

        .scan-instruction {
            font-size: 34px; 
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; text-shadow: 0 0 25px #0f0; }
        }

        .scan-container {
            position: relative;
            width: 500px; height: 500px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; 
            transform: scale(1.15);
            margin-top: 30px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,255,0,0.1);
        }

        .generated-palm-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: screen; 
            opacity: 0.6;
            filter: drop-shadow(0 0 5px #0f0);
            transition: all 0.3s ease;
            z-index: 2;
        }

        .hud-overlay {
            position: absolute;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .scan-grid {
            position: absolute;
            top: 10%; left: 10%; width: 80%; height: 80%;
            border-radius: 50%;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0;
            z-index: 1;
        }

        .hud-text {
            position: absolute;
            font-size: 14px;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #0f0;
            letter-spacing: 1px;
        }
        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; text-align: right; }
        .bottom-left { bottom: 20px; left: 20px; }
        .bottom-right { bottom: 20px; right: 20px; text-align: right; }

        .scanner-line {
            position: absolute; top: 0; left: -10%;
            width: 120%; height: 6px;
            background: #fff; box-shadow: 0 0 40px 15px #0f0;
            display: none; z-index: 10;
            border-radius: 50%;
        }

        .scanning .scanner-line { display: block; animation: sweep 2s linear infinite; }
        .scanning .generated-palm-image { animation: imageScanGlow 0.5s forwards 0.2s; }
        .scanning .hud-overlay { opacity: 1; }
        .scanning .scan-grid { animation: flashGrid 0.2s infinite alternate; }

        @keyframes sweep { 
            0% { top: 0%; opacity: 0; } 
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; } 
        }
        
        @keyframes imageScanGlow { 
            to { opacity: 1; filter: drop-shadow(0 0 40px #0f0) brightness(1.8); } 
        }

        @keyframes flashGrid {
            from { opacity: 0.1; }
            to { opacity: 0.5; }
        }

        /* --- SCREEN 3: Success --- */
        .status-accepted {
            font-size: 100px; 
            color: #0f0; margin: 0;
            text-shadow: 0 0 50px #0f0; letter-spacing: 10px; font-weight: 900;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .welcome-msg {
            font-size: 32px; 
            color: #fff; margin: 40px 0 0 0; line-height: 1.5;
            animation: fadeIn 1s forwards 0.5s; opacity: 0;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        .highlight { color: #0f0; font-weight: 900; text-shadow: 0 0 20px #0f0; }

        /* --- SCREEN 4: COUNTDOWN WITH PROGRESS BAR --- */
        .countdown-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 20;
        }

        .countdown-number {
            font-size: 250px; 
            font-weight: 900; 
            color: #fff; 
            margin: 0; 
            line-height: 1;
            text-shadow: 0 0 30px #0f0, 0 0 60px #0f0;
            animation: digital-pop 1s infinite; 
        }

        @keyframes digital-pop {
            0% { transform: scale(0.8); opacity: 0; }
            10% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 50px #0f0, 0 0 100px #0f0; }
            20% { transform: scale(1); opacity: 1; text-shadow: 0 0 20px #0f0; }
            90% { transform: scale(1); opacity: 1; text-shadow: 0 0 20px #0f0; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        .progress-bar-container {
            width: 60%;
            max-width: 600px;
            height: 15px;
            border: 2px solid #0f0;
            background: rgba(0, 50, 0, 0.4);
            border-radius: 10px;
            margin-top: 120px; 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%; 
            background: #0f0;
            box-shadow: 0 0 20px #0f0, inset 0 0 10px #fff;
        }

        @keyframes grow-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- SCREEN 5: FINAL LOGO (BREATHING) --- */
        #screen-final-logo { 
            background-color: #000; 
            z-index: 100; 
        }

        .final-logo-container {
            width: 70%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: zoomInLogo 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .final-logo {
            max-width: 100%;
            max-height: 100%;
            mix-blend-mode: screen; 
            
            /* Breathing Animation: 4 seconds per cycle */
            animation: breatheLogo 4s ease-in-out infinite;
        }

        @keyframes zoomInLogo {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes breatheLogo {
            0%, 100% { 
                transform: scale(1); 
                filter: 
                    drop-shadow(2px 2px 0px #fff) 
                    drop-shadow(-2px -2px 0px #fff) 
                    drop-shadow(2px -2px 0px #fff) 
                    drop-shadow(-2px 2px 0px #fff)
                    drop-shadow(0px 0px 30px rgba(255, 255, 255, 0.8)); 
            }
            50% { 
                transform: scale(1.05); 
                filter: 
                    drop-shadow(2px 2px 0px #fff) 
                    drop-shadow(-2px -2px 0px #fff) 
                    drop-shadow(2px -2px 0px #fff) 
                    drop-shadow(-2px 2px 0px #fff)
                    drop-shadow(0px 0px 60px rgba(255, 255, 255, 1)); 
            }
        }

    </style>
</head>
<body>

    <!-- HIDDEN UTILITY BUTTONS -->
    <button id="refresh-btn" onclick="location.reload()" title="Refresh Page">↻</button>
    <button id="fullscreen-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">⛶</button>

    <!-- OVERLAY 1: THE ROBOT SHELL -->
    <img src="shell.png" alt="Robot Frame" class="robot-shell-overlay">

    <!-- OVERLAY 2: THE BACKGROUND UTHM LOGO -->
    <img src="image_c8c162_2.png" alt="UTHM Background" class="bg-watermark">

    <!-- SCREEN 1: GREEN TURBINE EYES -->
    <div id="screen-eyes" class="screen active">
        <div class="eyes-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <button id="initiate-btn" onclick="startScanning()">Initiate Sequence</button>
    </div>

    <!-- SCREEN 2: BLUEPRINT SCANNER -->
    <div id="screen-scan" class="screen">
        <div class="scan-instruction">AWAITING BIOMETRIC INPUT</div>
        
        <div class="scan-container" id="scan-pad" onclick="triggerScanAnimation()">
            <img src="palms.jpg" alt="Scanning Interface" class="generated-palm-image">
            <div class="hud-overlay">
                <div class="hud-text top-left">SYS.VER: 9.0.4<br>STATUS: IDLE</div>
                <div class="hud-text top-right">BIO-METRIC<br>RECEIVER</div>
                <div class="hud-text bottom-left">LAT: 01.866<br>LON: 103.111</div>
                <div class="hud-text bottom-right" id="data-stream">ID: [WAITING]<br>UID: [NULL]</div>
            </div>
            <div class="scan-grid"></div>
            <div class="scanner-line"></div>
        </div>
    </div>

    <!-- SCREEN 3: SUCCESS -->
    <div id="screen-success" class="screen">
        <h1 class="status-accepted">ACCESS GRANTED</h1>
        <div class="welcome-msg">
            Welcome <span class="highlight" id="guest-name-display">Guest</span><br>
            to <br><span class="highlight" id="event-name-display">The Event</span>
        </div>
    </div>

    <!-- SCREEN 4: COUNTDOWN WITH PROGRESS BAR -->
    <div id="screen-countdown" class="screen">
        <div class="countdown-wrapper">
            <div class="countdown-number" id="countdown-display">5</div>
            
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- SCREEN 5: FINAL LOGO SCREEN (BREATHING) -->
    <div id="screen-final-logo" class="screen">
        <div class="final-logo-container">
            <!-- UPDATED FINAL LOGO FILENAME -->
            <img src="final.jpg" alt="Final Logo Error" class="final-logo">
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const guestName = "VIP GUEST";
        const eventName = "MAJLIS PELANTIKAN SEKOLAH ANGKAT<br>UNIVERSITI TUN HUSSEIN ONN MALAYSIA FASA 3<br>DAN MAJLIS PENUTUPAN KEMBARA MERDEKA DIGITAL";
        
        // --- DOM Elements ---
        const screenEyes = document.getElementById('screen-eyes');
        const screenScan = document.getElementById('screen-scan');
        const screenSuccess = document.getElementById('screen-success');
        const screenCountdown = document.getElementById('screen-countdown');
        const screenFinalLogo = document.getElementById('screen-final-logo');
        const scanPad = document.getElementById('scan-pad');
        const countdownDisplay = document.getElementById('countdown-display');
        const initiateBtn = document.getElementById('initiate-btn');
        const progressFill = document.getElementById('progress-fill');
        const generatedPalmImage = document.querySelector('.generated-palm-image');
        const dataStream = document.getElementById('data-stream');

        let scrambleInterval;

        // Apply config
        document.getElementById('guest-name-display').innerText = guestName;
        document.getElementById('event-name-display').innerHTML = eventName;

        // ==========================================
        //         AUDIO SYNTHESIZER ENGINE
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let scanOsc = null;
        let scanGain = null;
        
        // Variables for Logo Sound
        let logoOscillators = [];
        let logoGain = null;
        let logoLfo = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playStartupSound() {
            playTone(600, 'square', 0.1, 0.05);
            setTimeout(() => playTone(900, 'square', 0.2, 0.05), 100);
        }

        function playSuccessSound() {
            playTone(440, 'sine', 1, 0.1);   
            setTimeout(() => playTone(554.37, 'sine', 1, 0.1), 100); 
            setTimeout(() => playTone(659.25, 'sine', 1.5, 0.1), 200); 
        }

        function playCountdownBeep() {
            playTone(800, 'square', 0.15, 0.05); 
        }

        function playBassDrop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 2);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 3);
        }

        function startScanSound() {
            if (!audioCtx) return;
            scanOsc = audioCtx.createOscillator();
            scanGain = audioCtx.createGain();
            scanOsc.type = 'sawtooth';
            
            scanOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
            scanOsc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 1.5);
            scanOsc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 3.0);
            
            scanGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            
            scanOsc.connect(scanGain);
            scanGain.connect(audioCtx.destination);
            scanOsc.start();
        }

        function stopScanSound() {
            if (scanOsc) {
                scanOsc.stop();
                scanOsc.disconnect();
                scanGain.disconnect();
            }
        }

        function startLogoSound() {
            if (!audioCtx) return;
            
            logoGain = audioCtx.createGain();
            logoGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            logoGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 2); 
            logoGain.connect(audioCtx.destination);

            const freqs = [220.00, 261.63, 329.63, 392.00, 493.88];
            
            logoLfo = audioCtx.createOscillator();
            logoLfo.type = 'sine';
            // Adjusted to exactly match the 4-second breathing animation (1/4 = 0.25 Hz)
            logoLfo.frequency.value = 0.25; 
            
            logoOscillators = freqs.map(freq => {
                let osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                let vca = audioCtx.createGain();
                vca.gain.value = 0.5; 
                
                let lfoDepth = audioCtx.createGain();
                lfoDepth.gain.value = 0.4; 
                logoLfo.connect(lfoDepth);
                lfoDepth.connect(vca.gain);
                
                osc.connect(vca);
                vca.connect(logoGain);
                
                osc.start();
                return { osc, vca, lfoDepth };
            });
            
            logoLfo.start();
        }

        function stopLogoSound() {
            if (logoGain) {
                logoGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                setTimeout(() => {
                    logoOscillators.forEach(nodes => {
                        nodes.osc.stop();
                        nodes.osc.disconnect();
                        nodes.vca.disconnect();
                        nodes.lfoDepth.disconnect();
                    });
                    if (logoLfo) {
                        logoLfo.stop();
                        logoLfo.disconnect();
                    }
                    if (logoGain) logoGain.disconnect();
                    
                    logoOscillators = [];
                    logoGain = null;
                    logoLfo = null;
                }, 1500);
            }
        }

        // ==========================================
        //         APPLICATION LOGIC
        // ==========================================

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function startScanning() {
            initAudio();
            playStartupSound();

            screenEyes.classList.remove('active');
            screenScan.classList.add('active');
            
            scanPad.classList.remove('scanning');
            document.querySelector('.scan-instruction').innerText = "AWAITING BIOMETRIC INPUT";
            dataStream.innerHTML = "ID: [WAITING]<br>UID: [NULL]";
            
            generatedPalmImage.style.animation = 'none';
            generatedPalmImage.offsetHeight;
            generatedPalmImage.style.animation = null;
        }

        function startDataScramble() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            scrambleInterval = setInterval(() => {
                let r1 = ""; let r2 = "";
                for(let i=0; i<8; i++) r1 += chars.charAt(Math.floor(Math.random() * chars.length));
                for(let i=0; i<12; i++) r2 += chars.charAt(Math.floor(Math.random() * chars.length));
                dataStream.innerHTML = `ID: ${r1}<br>UID: ${r2}`;
            }, 50); 
        }

        function triggerScanAnimation() {
            if(scanPad.classList.contains('scanning')) return; 

            document.querySelector('.scan-instruction').innerText = "ANALYZING BIOMETRICS...";
            scanPad.classList.add('scanning');

            startScanSound();
            startDataScramble();

            setTimeout(() => {
                stopScanSound();
                clearInterval(scrambleInterval);
                dataStream.innerHTML = "ID: VERIFIED<br>UID: MATCH";
                showSuccessScreen();
            }, 3500);
        }

        function showSuccessScreen() {
            playSuccessSound();

            screenScan.classList.remove('active');
            screenSuccess.classList.add('active');

            setTimeout(() => {
                startFullscreenCountdown();
            }, 3000);
        }

        function startFullscreenCountdown() {
            screenSuccess.classList.remove('active');
            screenCountdown.classList.add('active');

            progressFill.style.animation = 'none';
            progressFill.offsetHeight; 
            progressFill.style.animation = 'grow-bar 5s linear forwards';

            let count = 5;
            countdownDisplay.innerText = count;
            playCountdownBeep(); 

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.innerText = count;
                    playCountdownBeep(); 
                } else {
                    clearInterval(countdownInterval);
                    showFinalLogoScreen();
                }
            }, 1000);
        }

        function showFinalLogoScreen() {
            playBassDrop(); 
            
            startLogoSound();

            screenCountdown.classList.remove('active');
            screenFinalLogo.classList.add('active');

            setTimeout(() => {
                resetToStart();
            }, 30000); 
        }

        function resetToStart() {
            stopLogoSound(); 

            screenFinalLogo.classList.remove('active');
            screenEyes.classList.add('active');
            initiateBtn.style.display = 'none';
        }
    </script>
</body>
</html>
